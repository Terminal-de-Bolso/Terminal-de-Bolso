<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terminal de Bolso — blog de tecnologia</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#ffffff;--ink:#111827;--muted:#4b5563;--accent:#2f7d4f;--line:#e5e7eb;--pastel:#b8e6c4;--onpastel:#12361f;}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f1115;--ink:#f3f4f6;--muted:#a3adb8;--accent:#8fd6a4;--line:#2a303a;--pastel:#a8e0b8;}
}
body{margin:0;background:var(--bg);color:var(--ink);font:1.125rem/1.9 system-ui,sans-serif;padding:2rem 1rem;}
.wrap{max-width:46rem;margin:0 auto;}
header{border-bottom:3px solid var(--ink);padding-bottom:1rem;margin-bottom:2rem;display:flex;justify-content:space-between;align-items:center;}
.logo{font-weight:800;font-size:1.6rem;color:var(--ink);text-decoration:none;}
.logo span{background:var(--pastel);color:var(--onpastel);padding:0 .25rem;border-radius:4px;}
article{border-bottom:1px solid var(--line);padding:1.5rem 0;}
article h3{font-size:1.4rem;margin:0 0 .5rem;}
article p{color:var(--muted);margin:0;}
.tag{display:inline-block;background:var(--pastel);color:var(--onpastel);border-radius:999px;padding:.1rem .7rem;font-size:.8rem;font-weight:800;margin-bottom:.5rem;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="#">Terminal <span>de Bolso</span></a>
  </header>
  <main id="lista"></main>
</div>
<script>
fetch('posts.json')
  .then(res => res.json())
  .then(data => {
    const lista = document.getElementById('lista');
    data.posts.forEach(p => {
      const art = document.createElement('article');
      art.innerHTML = `<span class="tag">${p.tag}</span><h3>${p.titulo}</h3><p>${p.texto.slice(0, 140)}...</p>`;
      lista.appendChild(art);
    });
  });
</script>
</body>
</html>
